<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Библиотека</title>
</head>
<body>

    <div>
        <a href="{% url 'index' %}">Главная</a>
        <a href="{% url 'books' %}">Книги</a>
        <a href="{% url 'authors' %}">Авторы</a>
        {% if user.is_authenticated %}
            <a href="{% url 'my-borrowed' %}">Мои книги</a>
        {% endif %}
        {% if user.is_staff %}
            <a href="{% url 'all-borrowed' %}">Выданные книги</a>
        {% endif %}

        {% if user.is_authenticated %}
            <span>Пользователь: {{ user.get_username }}</span>

            <form id="logout-form" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}?next={{ request.path }}">Войти</a>
        {% endif %}
    </div>

    <hr>

    {% block content %}
    {% endblock %}

</body>
</html>
